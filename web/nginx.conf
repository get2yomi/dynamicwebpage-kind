server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Used by Docker/Kubernetes health checks
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Everything under /api goes to the API container/service.
    # "api" is the service name in docker-compose AND in Kubernetes, so the same image works in both.
    # If the API is down the website still loads; only the subscribe form/badge report it.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
