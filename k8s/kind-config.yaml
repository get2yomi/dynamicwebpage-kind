# kind create cluster --name jupiter --config k8s/kind-config.yaml
# Maps NodePort 30080 inside the cluster to http://localhost:8081 on your laptop
# (8081 so it does not clash with docker compose on 8080).
#comment here
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8081
        protocol: TCP
