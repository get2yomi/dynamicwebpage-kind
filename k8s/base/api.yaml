apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: jupiter
  labels: { app: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: get2kunle/staticsite-api:latest
          imagePullPolicy: IfNotPresent   # lets you use images loaded with "kind load docker-image"
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
                  optional: true        # secret only exists in the "with MySQL" setup
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 192Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api            # nginx proxies to http://api:3000
  namespace: jupiter
spec:
  selector: { app: api }
  ports:
    - port: 3000
      targetPort: 3000
