# Practice passwords only. For anything real, create the secret with kubectl instead of committing it:
#   kubectl -n jupiter create secret generic mysql-secret \
#     --from-literal=MYSQL_ROOT_PASSWORD=... --from-literal=MYSQL_PASSWORD=...
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: jupiter
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: rootpass
  MYSQL_PASSWORD: jupiterpass
