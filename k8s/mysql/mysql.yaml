apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: jupiter
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi          # kind's default "standard" StorageClass provisions this automatically
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: jupiter
  labels: { app: mysql }
spec:
  replicas: 1
  strategy:
    type: Recreate          # never run two MySQL pods on the same volume
  selector:
    matchLabels: { app: mysql }
  template:
    metadata:
      labels: { app: mysql }
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: jupiter
            - name: MYSQL_USER
              value: jupiter
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: mysql-secret, key: MYSQL_ROOT_PASSWORD } }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: mysql-secret, key: MYSQL_PASSWORD } }
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 15
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: jupiter
spec:
  selector: { app: mysql }
  ports:
    - port: 3306
      targetPort: 3306
